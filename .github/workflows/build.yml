name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and check both authentication variants
        run: ./gradlew --no-daemon --console=plain assembleDebug assemblePin lintDebug lintPin
      - name: Package APKs and checksums
        run: bash scripts/package-apks.sh
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OhPorta-APKs
          path: artifacts/
          if-no-files-found: error
